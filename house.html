<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pop-up House</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@0;1&family=Crimson+Pro:ital,wght@0,400;1,400&display=swap">
<style>
  :root {
    --bg: #14100a;
    --ink: #e9d5a8;
    --muted: #8a7550;
    --track: #3a2c16;
    --accent: #d8b06a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body { background: var(--bg); overflow: hidden; font-family: 'Crimson Pro', Georgia, serif; color: var(--ink); }
  canvas { display: block; cursor: grab; touch-action: none; }
  canvas:active { cursor: grabbing; }
  #title { position: fixed; top: 18px; left: 22px; pointer-events: none; }
  #title h1 { font-family: 'Playfair Display', Georgia, serif; font-weight: 400; font-size: 20px; }
  #title p { font-style: italic; font-size: 13px; color: var(--muted); letter-spacing: .08em; }
  #ui {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: 18px 22px 22px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    background: linear-gradient(transparent, rgba(10, 7, 3, .9));
  }
  button {
    font: inherit; font-family: 'Playfair Display', Georgia, serif; font-size: 15px;
    color: var(--bg); background: var(--accent); border: 0; border-radius: 999px;
    padding: 9px 22px; cursor: pointer; min-width: 150px;
  }
  button:hover { filter: brightness(1.08); }
  #angle { flex: 1; min-width: 160px; accent-color: var(--accent); }
  #readout { font-size: 13px; color: var(--muted); min-width: 170px; text-align: right; font-variant-numeric: tabular-nums; }
  #hint { position: fixed; top: 20px; right: 22px; font-style: italic; font-size: 13px; color: var(--muted); pointer-events: none; text-align: right; }
  @media (max-width: 560px) {
    #hint { display: none; }
    #readout { text-align: left; min-width: 0; }
  }
</style>
</head>
<body>
<div id="title"><h1>The Pop-up House</h1><p>rigid-card pop-up mechanics</p></div>
<div id="hint">drag to look around · scroll to zoom</div>
<div id="ui">
  <button id="toggle">Open the book</button>
  <input id="angle" type="range" min="0" max="180" step="0.5" value="0" aria-label="Opening angle">
  <div id="readout">closed</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="lib/popup.js"></script>
<script src="lib/popup-three.js"></script>
<script src="designs/house.js"></script>
<script>
'use strict';
const DEG = Math.PI / 180;
const T = PopupThree.text;

// ── Paint: everything is drawn in panel units with +v up ─────────────────────
function rng(seed) {
  return function () { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
}

function clapboard(ctx, b, base, line) {
  ctx.fillStyle = base; ctx.fillRect(b.minU, b.minV, b.maxU - b.minU, b.maxV - b.minV);
  ctx.strokeStyle = line; ctx.lineWidth = 0.012;
  for (let v = b.minV + 0.12; v < b.maxV; v += 0.12) {
    ctx.beginPath(); ctx.moveTo(b.minU, v); ctx.lineTo(b.maxU, v); ctx.stroke();
  }
  // a darker band at the foot of the wall
  ctx.fillStyle = 'rgba(70,45,25,.18)'; ctx.fillRect(b.minU, b.minV, b.maxU - b.minU, 0.1);
}

function windowAt(ctx, u, v, w, h, lit) {
  ctx.fillStyle = '#5b4632'; ctx.fillRect(u - 0.035, v - 0.035, w + 0.07, h + 0.07); // frame shadow
  ctx.fillStyle = '#fbf6ea'; ctx.fillRect(u - 0.025, v - 0.025, w + 0.05, h + 0.05); // frame
  const g = ctx.createLinearGradient(u, v, u, v + h);
  g.addColorStop(0, lit ? '#ffe6a6' : '#9cc4d8'); g.addColorStop(1, lit ? '#f6b85a' : '#5d8fae');
  ctx.fillStyle = g; ctx.fillRect(u, v, w, h);
  ctx.fillStyle = '#fbf6ea';
  ctx.fillRect(u + w / 2 - 0.012, v, 0.024, h);
  ctx.fillRect(u, v + h / 2 - 0.012, w, 0.024);
  ctx.fillStyle = '#e8dcc0'; ctx.fillRect(u - 0.05, v - 0.06, w + 0.1, 0.04); // sill
  // shutters
  ctx.fillStyle = '#3f6b5a';
  ctx.fillRect(u - 0.15, v - 0.02, 0.1, h + 0.04);
  ctx.fillRect(u + w + 0.05, v - 0.02, 0.1, h + 0.04);
}

function door(ctx, u, v, w, h) {
  ctx.fillStyle = '#fbf6ea';
  ctx.beginPath(); ctx.moveTo(u - 0.04, v); ctx.lineTo(u - 0.04, v + h - w / 2);
  ctx.arc(u + w / 2, v + h - w / 2, w / 2 + 0.04, Math.PI, 0, true); ctx.lineTo(u + w + 0.04, v); ctx.fill();
  ctx.fillStyle = '#a23a2c';
  ctx.beginPath(); ctx.moveTo(u, v); ctx.lineTo(u, v + h - w / 2);
  ctx.arc(u + w / 2, v + h - w / 2, w / 2, Math.PI, 0, true); ctx.lineTo(u + w, v); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = 0.012;
  ctx.strokeRect(u + 0.06, v + 0.08, w - 0.12, h * 0.32);
  ctx.strokeRect(u + 0.06, v + 0.08 + h * 0.36, w - 0.12, h * 0.22);
  ctx.fillStyle = '#e8c35a'; ctx.beginPath(); ctx.arc(u + w - 0.07, v + h * 0.45, 0.025, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#d8ccb0'; ctx.fillRect(u - 0.08, v, w + 0.16, 0.05); // step
}

function tiles(ctx, b, base, dark) {
  ctx.fillStyle = base; ctx.fillRect(b.minU, b.minV, b.maxU - b.minU, b.maxV - b.minV);
  const r = rng(7), tw = 0.16, th = 0.13;
  for (let row = 0, v = b.minV; v < b.maxV; row++, v += th) {
    for (let u = b.minU - (row % 2) * tw / 2; u < b.maxU; u += tw) {
      ctx.fillStyle = r() < 0.3 ? dark : base;
      ctx.beginPath();
      ctx.moveTo(u, v + th); ctx.lineTo(u, v + th * 0.35);
      ctx.quadraticCurveTo(u + tw / 2, v - th * 0.25, u + tw, v + th * 0.35);
      ctx.lineTo(u + tw, v + th); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(60,20,10,.35)'; ctx.lineWidth = 0.01; ctx.stroke();
    }
  }
}

function bricks(ctx, b) {
  ctx.fillStyle = '#9a4b35'; ctx.fillRect(b.minU, b.minV, b.maxU - b.minU, b.maxV - b.minV);
  ctx.strokeStyle = '#d9c3a0'; ctx.lineWidth = 0.012;
  for (let row = 0, v = b.minV; v < b.maxV; row++, v += 0.07) {
    ctx.beginPath(); ctx.moveTo(b.minU, v); ctx.lineTo(b.maxU, v); ctx.stroke();
    for (let u = b.minU + (row % 2) * 0.07; u < b.maxU; u += 0.14) {
      ctx.beginPath(); ctx.moveTo(u, v); ctx.lineTo(u, v + 0.07); ctx.stroke();
    }
  }
  ctx.fillStyle = '#5a2c20'; ctx.fillRect(b.minU, b.maxV - 0.07, b.maxU - b.minU, 0.07); // cap
}

const WALL = '#f2dcae', WALL_LINE = 'rgba(150,110,60,.35)';
const styles = {
  frontWallLeft: { back: '#e9dcc0', paint(ctx, b) {
    clapboard(ctx, b, WALL, WALL_LINE);
    windowAt(ctx, 0.38, 0.5, 0.36, 0.48, true);
    windowAt(ctx, 1.12, 0.5, 0.36, 0.48, false);
  } },
  frontWallRight: { back: '#e9dcc0', paint(ctx, b) {
    clapboard(ctx, b, WALL, WALL_LINE);
    door(ctx, 0.36, 0, 0.4, 0.86);
    windowAt(ctx, 1.18, 0.5, 0.36, 0.48, true);
  } },
  backWallLeft: { back: '#e9dcc0', paint(ctx, b) {
    clapboard(ctx, b, WALL, WALL_LINE);
    windowAt(ctx, 0.76, 0.5, 0.36, 0.48, false);
  } },
  backWallRight: { back: '#e9dcc0', paint(ctx, b) {
    clapboard(ctx, b, WALL, WALL_LINE);
    windowAt(ctx, 0.76, 0.5, 0.36, 0.48, true);
  } },
  roof: { back: '#d9c9a8', paint(ctx, b) { tiles(ctx, b, '#b9533a', '#9c4330'); } },
  chimney: { back: '#c9b48e', paint(ctx, b) { bricks(ctx, b); } },
};

function paintSpread(ctx, b, house) {
  const W = b.maxU - b.minU, H = b.maxV - b.minV;
  const g = ctx.createLinearGradient(0, b.minV, 0, b.maxV);
  g.addColorStop(0, '#84b257'); g.addColorStop(1, '#689a45');
  ctx.fillStyle = g; ctx.fillRect(b.minU, b.minV, W, H);
  // soft paper margin
  ctx.strokeStyle = 'rgba(243,234,210,.85)'; ctx.lineWidth = 0.22;
  ctx.strokeRect(b.minU + 0.11, b.minV + 0.11, W - 0.22, H - 0.22);

  const r = rng(42);
  // grass tufts
  ctx.strokeStyle = 'rgba(60,110,40,.55)'; ctx.lineWidth = 0.014;
  for (let i = 0; i < 520; i++) {
    const u = b.minU + 0.3 + r() * (W - 0.6), v = b.minV + 0.3 + r() * (H - 0.6);
    ctx.beginPath(); ctx.moveTo(u, v); ctx.lineTo(u - 0.03, v + 0.07); ctx.moveTo(u, v); ctx.lineTo(u + 0.03, v + 0.07); ctx.stroke();
  }
  // a garden path from the reader's edge up to the front door (v = -z)
  const doorZ = house.doorAt;
  ctx.strokeStyle = '#e4cf9f'; ctx.lineCap = 'round'; ctx.lineWidth = 0.42;
  ctx.beginPath(); ctx.moveTo(1.6, b.minV + 0.1);
  ctx.bezierCurveTo(1.7, -2.2, 0.5, -1.9, doorZ[0], -doorZ[2] - 0.1); ctx.stroke();
  ctx.strokeStyle = 'rgba(160,130,80,.35)'; ctx.lineWidth = 0.02;
  for (let i = 0; i < 26; i++) {
    const t = i / 26, u = (1 - t) ** 3 * 1.6 + 3 * (1 - t) ** 2 * t * 1.7 + 3 * (1 - t) * t * t * 0.5 + t ** 3 * doorZ[0];
    const v = (1 - t) ** 3 * (b.minV + 0.1) + 3 * (1 - t) ** 2 * t * -2.2 + 3 * (1 - t) * t * t * -1.9 + t ** 3 * (-doorZ[2] - 0.1);
    ctx.beginPath(); ctx.ellipse(u, v, 0.09, 0.06, r() * 3, 0, Math.PI * 2); ctx.stroke();
  }
  // flowers
  const petals = ['#f6d4e0', '#fff4c2', '#f3a6a0', '#c9d8ff', '#ffffff'];
  for (let i = 0; i < 140; i++) {
    const u = b.minU + 0.35 + r() * (W - 0.7), v = b.minV + 0.35 + r() * (H - 0.7);
    if (Math.abs(u) < 2.2 && v > -2.6 && v < 2.0) continue; // keep the house plot clear
    ctx.fillStyle = petals[i % petals.length];
    ctx.beginPath(); ctx.arc(u, v, 0.035 + r() * 0.02, 0, Math.PI * 2); ctx.fill();
  }
  // a pond on the left page
  ctx.fillStyle = '#7fb3c9';
  ctx.beginPath(); ctx.ellipse(-3.1, 1.6, 0.9, 0.55, 0.3, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.35)';
  ctx.beginPath(); ctx.ellipse(-3.3, 1.75, 0.35, 0.08, 0.3, 0, Math.PI * 2); ctx.fill();
  // caption
  T(ctx, 'Home', -2.6, -2.75, 0.5, { color: 'rgba(45,70,30,.75)', family: '"Playfair Display", Georgia, serif', style: 'italic' });
}

function paintCover(ctx, b) {
  const W = b.maxU, H = b.maxV;
  ctx.strokeStyle = '#d8b06a'; ctx.lineWidth = 0.04;
  ctx.strokeRect(0.3, 0.3, W - 0.6, H - 0.6);
  ctx.lineWidth = 0.015; ctx.strokeRect(0.42, 0.42, W - 0.84, H - 0.84);
  T(ctx, 'The Pop-up', W / 2, H * 0.62, 0.55, { color: '#e2c27f', family: '"Playfair Display", Georgia, serif', style: 'italic' });
  T(ctx, 'House', W / 2, H * 0.62 - 0.75, 0.75, { color: '#e2c27f', family: '"Playfair Display", Georgia, serif' });
  // a little gold house
  ctx.strokeStyle = '#d8b06a'; ctx.lineWidth = 0.035;
  const cx = W / 2, cy = H * 0.3;
  ctx.beginPath(); ctx.moveTo(cx - 0.5, cy - 0.4); ctx.lineTo(cx - 0.5, cy + 0.15); ctx.lineTo(cx, cy + 0.6);
  ctx.lineTo(cx + 0.5, cy + 0.15); ctx.lineTo(cx + 0.5, cy - 0.4); ctx.closePath(); ctx.stroke();
}

// ── Scene ────────────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#14100a');
const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.05, 200);

scene.add(new THREE.HemisphereLight('#fff3dc', '#3a2a18', 0.55));
const sun = new THREE.DirectionalLight('#fff1d6', 1.05);
sun.position.set(-5, 11, 7);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -9, right: 9, top: 9, bottom: -9, near: 1, far: 40 });
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.02;
scene.add(sun);
const rim = new THREE.DirectionalLight('#a9c4ff', 0.25);
rim.position.set(6, 4, -8);
scene.add(rim);

const table = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.MeshStandardMaterial({ color: '#3b2615', roughness: 0.9 }));
table.rotation.x = -Math.PI / 2;
table.position.y = -0.18;
table.receiveShadow = true;
scene.add(table);

// ── The pop-up ───────────────────────────────────────────────────────────────
const design = PopupHouse.buildHouse(Popup, { styles });
const sim = new Popup.Simulation(design, { maxStep: 1 * DEG });
const doorPanel = design.panels.find((p) => p.name === 'front-wall-right');
const doorAt = (function () {
  const a = design.pos(doorPanel.outline[0]), b = design.pos(doorPanel.outline[1]);
  return Popup.vec.lerp(a, b, 0.56 / Popup.vec.len(Popup.vec.sub(b, a)));
})();

let view;
const fontsReady = document.fonts
  ? Promise.race([
      Promise.all([document.fonts.load('italic 100px "Playfair Display"'), document.fonts.load('100px "Playfair Display"')]),
      new Promise((r) => setTimeout(r, 1500)),
    ])
  : Promise.resolve();

fontsReady.then(() => {
  view = PopupThree.createView(THREE, sim, {
    renderer,
    paintSpread: (ctx, b) => paintSpread(ctx, b, { doorAt }),
    paintCover,
    coverColor: '#6e2620',
  });
  scene.add(view.root);
  // Fold the design shut (it is authored open) so the book starts closed.
  sim.setAngle(0);
  view.update();
  setTimeout(() => animateTo(180), 700);
});

// ── Opening and closing ──────────────────────────────────────────────────────
const toggle = document.getElementById('toggle');
const slider = document.getElementById('angle');
const readout = document.getElementById('readout');
let tween = null;

function ease(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }

function animateTo(deg) {
  const from = sim.angle / DEG;
  tween = { from, to: deg, start: performance.now(), dur: 400 + Math.abs(deg - from) * 14 };
}

toggle.addEventListener('click', () => {
  const target = tween ? tween.to : sim.angle / DEG;
  animateTo(target > 90 ? 0 : 180);
});
slider.addEventListener('input', () => {
  tween = null;
  sim.setAngle(parseFloat(slider.value) * DEG);
});

function syncUi() {
  const deg = sim.angle / DEG;
  slider.value = deg.toFixed(1);
  const going = tween ? tween.to : deg;
  toggle.textContent = going > 90 ? 'Close the book' : 'Open the book';
  const s = sim.strain().value;
  readout.textContent = (deg < 0.6 ? 'closed' : Math.round(deg) + '° open') + ' · paper strain ' + (s < 1e-6 ? '0' : (s * 100).toFixed(2) + '%');
}

// ── Camera ───────────────────────────────────────────────────────────────────
const orbit = { az: 0.42, el: 0.62, r: 15.5, target: new THREE.Vector3(0.3, 0.6, 0.2) };
function placeCamera() {
  // look at the middle of the book: the closed book sits on the right half
  if (sim) orbit.target.x = 0.3 + (design.pageWidth / 2 - 0.3) * (1 - Math.min(1, sim.angle / (100 * DEG)));
  orbit.el = Math.min(1.45, Math.max(0.08, orbit.el));
  orbit.r = Math.min(40, Math.max(5, orbit.r));
  camera.position.set(
    orbit.target.x + orbit.r * Math.cos(orbit.el) * Math.sin(orbit.az),
    orbit.target.y + orbit.r * Math.sin(orbit.el),
    orbit.target.z + orbit.r * Math.cos(orbit.el) * Math.cos(orbit.az)
  );
  camera.lookAt(orbit.target);
}
function fit() {
  camera.aspect = window.innerWidth / window.innerHeight;
  // keep the open spread in view on narrow screens
  orbit.r = Math.max(orbit.r, camera.aspect < 1 ? 15.5 / camera.aspect * 0.9 : 15.5);
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  placeCamera();
}
const cvs = renderer.domElement;
let drag = null;
cvs.addEventListener('pointerdown', (e) => { drag = { x: e.clientX, y: e.clientY }; cvs.setPointerCapture(e.pointerId); });
cvs.addEventListener('pointerup', () => (drag = null));
cvs.addEventListener('pointermove', (e) => {
  if (!drag) return;
  orbit.az -= (e.clientX - drag.x) * 0.006;
  orbit.el += (e.clientY - drag.y) * 0.004;
  drag = { x: e.clientX, y: e.clientY };
  placeCamera();
});
cvs.addEventListener('wheel', (e) => { e.preventDefault(); orbit.r *= Math.exp(e.deltaY * 0.001); placeCamera(); }, { passive: false });
window.addEventListener('resize', fit);
fit();

// ── Loop ─────────────────────────────────────────────────────────────────────
function frame(now) {
  requestAnimationFrame(frame);
  if (view) {
    if (tween) {
      const t = Math.min(1, (now - tween.start) / tween.dur);
      sim.setAngle((tween.from + (tween.to - tween.from) * ease(t)) * DEG);
      if (t >= 1) tween = null;
    }
    view.update();
    placeCamera();
    syncUi();
  }
  renderer.render(scene, camera);
}
requestAnimationFrame(frame);
window.__popup = { sim, design, animateTo, orbit, placeCamera, get view() { return view; } };
</script>
</body>
</html>
